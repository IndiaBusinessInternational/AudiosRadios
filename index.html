<div id="app">
  <header class="topbar" id="topbar">
    <span class="badge" id="versionBadge" title="App version">v1.4</span>
    <div class="brand"><svg aria-hidden="true"><use href="#i-mark"/></svg><b>IBI Audios &amp; Radios</b></div>
    <button type="button" class="top-share" id="shareTop" aria-label="Share this app" title="Share this app"><svg class="i" aria-hidden="true"><use href="#i-share"/></svg></button>
    <button type="button" class="top-btn" id="installTop" hidden>Install</button>
    <button type="button" class="switch" id="themeTop" role="switch" aria-checked="true" aria-label="Dark theme"><span class="track"><span class="knob"></span></span><span class="lab">Dark</span></button>
  </header>

  <section id="globeWrap" aria-label="Globe of radio stations">
    <div id="globe"></div>
    <div class="ring" id="ring" aria-hidden="true"></div>
    <div id="globeMsg" role="status"><div class="spin"></div><div id="globeMsgText">Loading the world's radio…</div></div>
    <div class="filterchip" id="filterChip" hidden><span id="filterChipText"></span><button type="button" id="filterClear" aria-label="Clear filter"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="fabs">
      <button type="button" class="fab" id="fabRandom" title="Surprise me: a random station (R)" aria-label="Surprise me"><svg class="i"><use href="#i-shuffle"/></svg></button>
      <button type="button" class="fab" id="fabLocate" title="Stations near me" aria-label="Stations near me"><svg class="i"><use href="#i-locate"/></svg></button>
      <button type="button" class="fab hide-phone" id="fabIn" title="Zoom in" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
      <button type="button" class="fab hide-phone" id="fabOut" title="Zoom out" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Stations">
    <div class="grab" id="grab" aria-hidden="true"></div>
    <div class="placehead" id="placeHead">
      <button type="button" class="count" id="placeCount" aria-label="Show stations">0</button>
      <button type="button" class="pl" id="placeOpen" style="text-align:left"><div class="pn" id="placeName">—</div><div class="pc" id="placeSub">Spin the globe to choose a city</div></button>
      <div class="lt" id="placeTime"></div>
      <button type="button" class="iconbtn collapse-x" id="collapseBtn" aria-label="Close list" title="Close (Esc)"><svg class="i"><use href="#i-down"/></svg></button>
    </div>
    <div class="view" id="view" role="tabpanel"></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" class="tab" role="tab" data-tab="explore" aria-selected="true"><svg class="i"><use href="#i-explore"/></svg><span>Explore</span></button>
      <button type="button" class="tab" role="tab" data-tab="favs" aria-selected="false"><svg class="i"><use href="#i-heart"/></svg><span>Favourites</span></button>
      <button type="button" class="tab" role="tab" data-tab="browse" aria-selected="false"><svg class="i"><use href="#i-browse"/></svg><span>Browse</span></button>
      <button type="button" class="tab" role="tab" data-tab="search" aria-selected="false"><svg class="i"><use href="#i-search"/></svg><span>Search</span></button>
      <button type="button" class="tab" role="tab" data-tab="settings" aria-selected="false"><svg class="i"><use href="#i-settings"/></svg><span>Settings</span></button>
    </nav>
    <div class="mini" id="mini">
      <button type="button" class="art" id="miniArt" aria-label="Open player">♪</button>
      <button type="button" class="meta" id="miniMeta" aria-label="Open player"><div class="t1" id="miniT1">Nothing playing</div><div class="t2" id="miniT2">Tap a station to listen live</div></button>
      <button type="button" class="iconbtn" id="miniFav" aria-label="Add to favourites" title="Favourite (F)"><svg class="i"><use href="#i-heart"/></svg></button>
      <button type="button" class="iconbtn hide-phone" id="miniPrev" aria-label="Previous station" title="Previous (←)"><svg class="i"><use href="#i-prev"/></svg></button>
      <button type="button" class="playbtn" id="miniPlay" aria-label="Play" title="Play / pause (Space)"><svg class="i fill"><use href="#i-play"/></svg></button>
      <button type="button" class="iconbtn" id="miniNext" aria-label="Next station" title="Next (→)"><svg class="i"><use href="#i-next"/></svg></button>
      <input type="range" class="vol" id="miniVol" min="0" max="100" value="90" aria-label="Volume" title="Volume (↑ ↓)">
    </div>
  </aside>
</div>

<div id="toast" aria-live="polite"></div>
<div class="offline" id="offlineBar" hidden>You are offline. Favourites are saved on this device; live radio needs the internet.</div>
<div class="banner" id="installBanner" hidden>
  <svg width="34" height="34" aria-hidden="true"><use href="#i-mark"/></svg>
  <div class="bt"><b>Install IBI Audios &amp; Radios</b><span id="installBannerText">Open it from your home screen like any app.</span></div>
  <button type="button" class="btn" id="installBannerBtn">Install</button>
  <button type="button" class="iconbtn" id="installBannerX" aria-label="Not now"><svg class="i"><use href="#i-x"/></svg></button>
</div>
<input type="file" id="restoreFile" accept="application/json,.json" hidden>
<audio id="audio" preload="none"></audio>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js" defer></script>
<script src="app.js?v=1.4" defer></script>
