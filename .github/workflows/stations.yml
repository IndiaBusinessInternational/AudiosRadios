name: Build and deploy
# Builds the station map from Radio Browser and publishes the site to GitHub Pages:
# on every push to main, and every night at 3:00 AM India time (21:30 UTC) so the stations stay fresh.
# The station data is built here and never committed, so the repo does not grow every night.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the station map
        run: python scripts/build_stations.py
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html app.css app.js sw.js manifest.json og-banner.png icons img data _site/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
